  <g transform="translate(990 92)">
    <path d="M0 46 L30 22 L60 46 V72 H0 Z" fill="#F3EFE6"/><path d="M-4 48 L30 18 L64 48" fill="none" stroke="#C0603A" stroke-width="7" stroke-linejoin="round"/>
