  </g>
  <g transform="translate(1080 100)">
    <path d="M0 40 L24 22 L48 40 V64 H0 Z" fill="#F3EFE6"/><path d="M-4 42 L24 18 L52 42" fill="none" stroke="#C0603A" stroke-width="6" stroke-linejoin="round"/>
