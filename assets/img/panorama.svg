  </g>
  <!-- pantai -->
  <path d="M520 150 C560 146 600 152 640 150 L700 240 H520 Z" fill="#EAD9B5"/>
  <!-- mangrove -->
  <g fill="#2F6E58">
    <ellipse cx="560" cy="132" rx="30" ry="20"/><ellipse cx="590" cy="122" rx="26" ry="22"/><ellipse cx="618" cy="134" rx="24" ry="16"/>
  </g>
  <path d="M566 150 l-6 14 M574 150 l2 16 M596 144 l-8 20 M600 144 l6 20 M612 148 l4 14" stroke="#5B4632" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- kelapa -->
  <g transform="translate(668 64)">
    <path d="M10 120 C14 80 6 40 16 6" stroke="#6B5338" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M16 6 C0 -2 -16 4 -24 16 M16 6 C28 -6 44 -4 54 6 M16 6 C8 14 2 26 0 36 M16 6 C30 12 38 22 40 34 M16 6 C14 -8 20 -16 28 -20" stroke="#3E8A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- daratan dan sawah -->
  <path d="M640 150 C760 140 900 146 1200 136 V240 H700 Z" fill="#9CC27A"/>
  <path d="M700 172 C820 166 980 170 1200 160 M720 194 C850 188 1000 192 1200 182 M740 216 C880 212 1030 214 1200 206" stroke="#7FAE5E" stroke-width="3" fill="none"/>
  <g stroke="#5E9450" stroke-width="2" stroke-linecap="round">
    <path d="M790 176v-8M806 176v-8M822 175v-8M838 175v-8M854 175v-8M870 174v-8M886 174v-8M902 174v-8"/>
    <path d="M800 199v-8M816 199v-8M832 198v-8M848 198v-8M864 198v-8M880 198v-8M896 197v-8M912 197v-8"/>
  </g>
