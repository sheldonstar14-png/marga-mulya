<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax slice">
  <!-- Panorama Marga Mulya: laut dan perahu (kiri), mangrove, pantai dan kelapa, sawah dan rumah warga (kanan) -->
  <circle cx="930" cy="70" r="34" fill="#F5A25A" opacity=".9"/>
  <!-- laut -->
  <path d="M0 150 H560 V240 H0Z" fill="#1E8C93"/>
  <path d="M0 150 H560 V166 H0Z" fill="#46A9AE"/>
  <path d="M20 182c14-6 28-6 42 0s28 6 42 0M150 200c14-6 28-6 42 0s28 6 42 0M300 178c14-6 28-6 42 0s28 6 42 0M420 206c14-6 28-6 42 0" stroke="#BFE6E6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- perahu nelayan -->
  <g transform="translate(150 118)">
    <path d="M0 34 H120 L104 52 H14 Z" fill="#0B3C5D"/>
    <path d="M6 40 H114" stroke="#F08A3C" stroke-width="4"/>
    <path d="M58 34 V-6" stroke="#0B3C5D" stroke-width="3"/>
    <path d="M60 -4 L92 28 H60 Z" fill="#F3EFE6"/>
    <path d="M58 -6 l14 4 -14 4z" fill="#F08A3C"/>
  </g>
  <g transform="translate(380 140) scale(.6)">
